# Merges a Dependabot PR into main once CI is green, without waiting on a
# review. This is the one way a change reaches main without a human merging
# it, and it is for dependency updates only: scripts/deps-automerge-check.sh
# refuses anything not opened by Dependabot, on a branch other than its own,
# with a commit anyone else pushed, or green on a commit that is no longer the
# head (tested in internal/pipeline). A workflow_run trigger always runs the
# default branch's copy of this file, so a PR cannot loosen the gate for its
# own merge.
#
# Majors merge too, if CI passes: CI is the review. A merge made with the
# workflow token starts no further workflows, so release-please picks these up
# with the next push to main rather than on their own.
name: Dependency auto-merge
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
# Set explicitly: a run Dependabot triggered gets a read-only token otherwise.
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: deps-automerge
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Merge if eligible
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          CI_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          prs="$(gh pr list --repo "$REPO" --state open --head "$HEAD_BRANCH" --json number --jq '[.[].number] | join(" ")')"
          if [ -z "$prs" ] || [ "$(wc -w <<<"$prs")" -ne 1 ]; then
            echo "no single open PR for $HEAD_BRANCH (found: ${prs:-none}); nothing to do"
            exit 0
          fi
          pr="$(gh pr view "$prs" --repo "$REPO" --json number,author,baseRefName,headRefName,headRefOid,isDraft,isCrossRepository,commits)"
          if ! verdict="$(jq -n --argjson pr "$pr" --arg sha "$CI_SHA" '{pr: $pr, ci_sha: $sha}' | scripts/deps-automerge-check.sh)"; then
            echo "$verdict"
            exit 0
          fi
          echo "$verdict"
          gh pr merge "$prs" --repo "$REPO" --squash --delete-branch --match-head-commit "$CI_SHA"
