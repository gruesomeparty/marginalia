name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          # The action's cache key does not include the module graph, so a
          # dependency change restores analysis facts computed against the old
          # one — which surfaced as six phantom staticcheck SA5011 findings in
          # test files that plainly use t.Fatal, none of which the same binary
          # reproduces on a clean run. The job takes twelve seconds; a lint
          # result you can trust is worth more than the cache.
          skip-cache: true
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Test
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage gate + summary
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/coverage.sh 80
      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - run: go build ./...
  # The hosted image, as a release would build it (goreleaser snapshot, both
  # architectures), then the amd64 one started the way a platform starts it:
  # no volume, a file:///tmp store, secrets from the environment, as a
  # non-root user. It has to answer the health check and take a publish.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # Builds the image a release ships; build it the way a release does.
          cache: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=homebrew
        env:
          HOMEBREW_TAP_TOKEN: ''
      - name: Smoke-test the amd64 image
        run: ./scripts/image-smoke.sh
  # deploy/cloudflare checked as far as a deploy goes without an account: the
  # Worker typechecks against the runtime its compatibility date names, and
  # wrangler bundles it and validates the config. The image build is left out
  # (--containers-rollout=none): a release PR moves the Dockerfile's tag to a
  # version whose image is only published once that PR is merged, and the
  # tag itself is pinned to the release by deploy_template_test.go.
  cloudflare-template:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist --containers-rollout=none
  # Static analysis of these workflows: template injection from issue or PR
  # text, credentials left on disk, broad tokens, unpinned actions. Agents run
  # here with write tokens on a public repository, so a finding is a hole.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Fail the job on findings instead of uploading them to code scanning.
          advanced-security: false
          min-severity: medium
  # What a pull request adds to go.mod or the Cloudflare template's
  # package-lock.json: refused if it carries a known high-severity
  # vulnerability or a licence an MIT project cannot ship. Agents open PRs
  # here, and so does Renovate, which merges its own on green.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Permissive licences only. Checked against the changed
          # dependencies, not the whole graph, so a new one that is not on
          # this list is a decision to make in that PR.
          allow-licenses: >-
            MIT, MIT-0, BSD-2-Clause, BSD-3-Clause, Apache-2.0, ISC, MPL-2.0,
            Unlicense, 0BSD, CC0-1.0, BlueOak-1.0.0, Python-2.0, Zlib
