# Drains the approved-for-agent queue: one issue, one branch off its base, one
# PR. The base is main unless the issue carries a base:feature/* label; a PR into
# main waits for a human, a PR into a feature branch is merged on green CI by
# integration-automerge.yml. This workflow never merges anything, and nothing
# reaches main without a human.
#
# This is the work loop. It runs when an issue is approved (the
# approved-for-agent label is added, by Berkay or by triage when
# TRIAGE_AUTO_APPROVE is on), when a pipeline PR merges (so the next issue
# starts without waiting for the schedule), on a weekday schedule as a sweep,
# and by hand. Each run still does at most one issue and stops while a pipeline
# PR is open, so the loop moves at the pace PRs are reviewed.
#
# Off unless the repository variable IMPLEMENT_LOOP is "true". Issues are
# implemented in project sessions for now, so every trigger below (an
# approval, a merge, the dispatches from triage, the merge loop and
# integration auto-merge, the schedule, a manual run) starts a run whose job
# is skipped. The triage, review and merge loops do not depend on this one.
#
# With the variable set it is also armed by credentials: with no
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) or ANTHROPIC_API_KEY
# repository secret every run skips with a notice.
name: Implement approved queue
on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue to implement (blank: whatever the triage gate names next)"
        required: false
        type: string
  issues:
    types: [labeled]
  pull_request:
    types: [closed]
  schedule:
    - cron: '17 6 * * 1-5'   # weekdays 06:17 UTC
permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
concurrency:
  # One run at a time: two concurrent runs would produce two open PRs, which is
  # the stack this pipeline exists to avoid.
  group: implement-approved
  cancel-in-progress: false
jobs:
  implement:
    # Only the events that can make a new issue workable: an approval, or a
    # pipeline PR merging (which frees the one-open-PR slot).
    if: >-
      vars.IMPLEMENT_LOOP == 'true' && (
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && github.event.label.name == 'approved-for-agent') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged &&
        startsWith(github.event.pull_request.head.ref, 'claude/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] claude-code-action pushes its branch with these credentials
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Install the linter version CI pins
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Require credentials
        id: creds
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH$KEY" ]; then echo "ready=true" >>"$GITHUB_OUTPUT"; else
            echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret; the work loop is disarmed"
          fi
      - name: Pick the model
        id: model
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue || (github.event_name == 'issues' && github.event.issue.number) || '' }}
        # Sonnet implements; Opus only when the named issue carries model:opus,
        # a label only someone with triage rights can add.
        run: |
          model=claude-sonnet-5-5
          if [[ "$ISSUE" =~ ^[0-9]+$ ]] &&
            gh issue view "$ISSUE" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx 'model:opus'; then
            model=claude-opus-5-5
          fi
          echo "model=$model" >>"$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        if: steps.creds.outputs.ready == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # This repository's own workflows start runs with the workflow
          # token (a triage approval, a merge, the chain), and the action
          # refuses a bot actor unless named. Only that one: an outside app
          # stays refused, and the github-actions bot acts for no one else.
          allowed_bots: github-actions[bot]
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: ${{ inputs.issue || (github.event_name == 'issues' && github.event.issue.number) || '' }}

            Follow skills/implement-approved/SKILL.md in this checkout, exactly.

            In short: stop if a pipeline PR is already open; run the triage gate
            (scripts/approved-queue.sh, fed with --json number,title,body,labels)
            over the approved-for-agent queue; take the issue named above if
            given and ready, else the one the gate names next; implement the
            smallest change that satisfies its stated acceptance criterion on a
            branch off the base the gate names (main, or the feature/* branch
            from the issue's base: label — create it from main if it does not
            exist yet); run go build, go test -race, the coverage gate and
            golangci-lint; then open one PR against that base with
            "Closes #<issue>" and stop.

            Write for two readers. The PR's visible text is for Berkay: a title,
            "Closes #<issue>", and three or four short lines on what changed and
            how it was verified. Everything for agents — the plan you followed,
            files touched, decisions the issue left open, what a follow-up run
            needs — goes in one hidden <!-- agent:handoff ... --> block at the
            end of the body. The issue's <!-- agent:triage ... --> block, if
            present, is your starting plan, not a spec: the issue's own text and
            the acceptance criterion win where they differ. Never put a Claude
            session or project link in a commit, PR or comment.

            Never merge or approve. Never implement an issue that lacks the
            approved-for-agent label or an acceptance criterion — comment on it
            saying what is missing instead. Read PRD.md and CLAUDE.md first: a
            change that breaks one of the invariants there is wrong even if the
            issue asked for it, and saying so on the issue is the right outcome.
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(go:*),Bash(gofmt:*),Bash(golangci-lint:*),Bash(git:*),Bash(gh:*),Bash(./scripts/approved-queue.sh)"
