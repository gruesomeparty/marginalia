name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # The demo is generated from the binary, so a change to the renderer
      # changes the landing page.
      - 'internal/**'
      - 'cmd/**'
      - 'go.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, since a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The diagram in the demo is drawn, and every shape in it is anchored —
      # that is the hero's whole argument, so the page is not published
      # without it. mermaid's own CLI is the only way to draw one; as root it
      # needs puppeteer told not to sandbox.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mermaid-cli
        run: |
          npm i -g @mermaid-js/mermaid-cli
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"]}' > /tmp/puppeteer.json

      # The hero is a real review page, not a picture of one. Generating it
      # here rather than committing it means the demo can never drift from the
      # binary it is demonstrating. The script also enforces the product's own
      # rule — an exported review loads nothing — and fails the deploy if the
      # page ever gains an external reference.
      - name: Build the live demo
        env:
          MARGINALIA_MMDC_ARGS: -p /tmp/puppeteer.json
        run: ./scripts/demo.sh site/demo.html auto

      # No `enablement: true` here, though the action offers it and the error
      # you get with Pages switched off recommends it: creating a Pages site
      # is repo-admin, which GITHUB_TOKEN does not have and no `permissions:`
      # block can grant it, so it fails with "Resource not accessible by
      # integration" after doing the whole build. Turning Pages on is a
      # one-time click at Settings → Pages → Source → GitHub Actions.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
