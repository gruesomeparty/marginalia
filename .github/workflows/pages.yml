name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # The demo is generated from the binary, so a change to the renderer
      # changes the landing page.
      - 'internal/**'
      - 'cmd/**'
      - 'go.*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, since a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # The hero is a real review page, not a picture of one. Generating it
      # here rather than committing it means the demo can never drift from the
      # binary it is demonstrating.
      - name: Build the live demo
        run: |
          set -euo pipefail
          go build -o /tmp/marginalia .
          work="$(mktemp -d)"
          cp site/demo/handover.md "$work/handover.md"
          cp site/demo/review.yaml "$work/review.yaml"
          cp site/demo/feedback.jsonl "$work/handover.md.feedback.jsonl"
          /tmp/marginalia export "$work/handover.md" \
            --config "$work/review.yaml" --diagrams=off -o site/demo.html
          test -s site/demo.html

      # The product's own rule, applied to its landing page: the exported
      # review loads nothing. If that ever stops being true, the page should
      # fail here rather than start making requests on someone else's machine.
      - name: The demo must still load nothing
        run: |
          if grep -Eq 'https?://' site/demo.html; then
            echo "demo.html gained an external reference:" >&2
            grep -Eo 'https?://[^"'"'"' )]*' site/demo.html | sort -u >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
