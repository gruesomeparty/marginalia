name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      # The demo is generated from the binary, so a change to the renderer
      # changes the landing page.
      - 'internal/**'
      - 'cmd/**'
      - 'go.*'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; never cancel one in flight, since a half-published
# site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      # The diagram in the demo is drawn, and every shape in it is anchored —
      # that is the hero's whole argument, so the page is not published
      # without it. mermaid's own CLI is the only way to draw one; as root it
      # needs puppeteer told not to sandbox.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      # Pinned, and pinned to the one version the repo already commits to:
      # internal/diagram/testdata holds a real mmdc render whose filename names
      # its version, and fixture_test.go drives it through the whole pipeline
      # so a mermaid upgrade that renames a shape fails a test instead of
      # silently producing a picture nobody can click. Installing `@latest`
      # here let CI draw the hero with a version no test had ever seen — and
      # 12.0.0 duly embedded a webfont, tripping the loads-nothing check with
      # the font's licence URL. Reading the version off the fixture means the
      # pin cannot drift from it: adopting a new mermaid is re-rendering that
      # one file, exactly as the test's own instructions say.
      - name: Install mermaid-cli
        run: |
          set -euo pipefail
          shopt -s nullglob
          fixtures=(internal/diagram/testdata/flowchart-mermaid-cli-*.svg)
          if [ ${#fixtures[@]} -ne 1 ]; then
            echo "expected exactly one mermaid-cli fixture, found ${#fixtures[@]}" >&2
            printf '%s\n' "${fixtures[@]}" >&2
            exit 1
          fi
          version="$(basename "${fixtures[0]}" .svg)"
          version="${version#flowchart-mermaid-cli-}"
          echo "pinning mermaid-cli to $version, the version testdata was rendered with"
          npm i -g "@mermaid-js/mermaid-cli@$version"
          echo '{"args":["--no-sandbox","--disable-setuid-sandbox","--disable-dev-shm-usage"]}' > /tmp/puppeteer.json

      # The hero is a real review page, not a picture of one. Generating it
      # here rather than committing it means the demo can never drift from the
      # binary it is demonstrating. The script also enforces the product's own
      # rule — an exported review loads nothing — and fails the deploy if the
      # page ever gains an external reference.
      - name: Build the live demo
        env:
          MARGINALIA_MMDC_ARGS: -p /tmp/puppeteer.json
        run: ./scripts/demo.sh site/demo.html auto

      # No `enablement: true` here, though the action offers it and the error
      # you get with Pages switched off recommends it: creating a Pages site
      # is repo-admin, which GITHUB_TOKEN does not have and no `permissions:`
      # block can grant it, so it fails with "Resource not accessible by
      # integration" after doing the whole build. Turning Pages on is a
      # one-time click at Settings → Pages → Source → GitHub Actions.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
