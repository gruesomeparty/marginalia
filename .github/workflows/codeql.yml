name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '27 3 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    # Code scanning upload requires GitHub Advanced Security on private repos.
    # Skip (green) while private; auto-activates on push/PR once the repo is public.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.37.9
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v4.37.9
