name: Release
on:
  push:
    branches: [main]
  # The merge loop dispatches this after a merge made with the workflow token,
  # which starts no push workflow of its own.
  workflow_dispatch:
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The hosted image goes to GHCR under this repository.
      packages: write
      # Build provenance: a signed statement, kept by GitHub and pushed beside
      # the image, of which workflow run built each artifact.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          # A release must not restore a cache a PR run could have written.
          cache: false
      # The image is built for linux/amd64 and linux/arm64; the arm64 half
      # runs under emulation on this runner, which is what QEMU is for.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser's sboms step shells out to syft.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to gruesomeparty/homebrew-tap.
          # GITHUB_TOKEN cannot push cross-repo, so this is a PAT with
          # contents:write on the tap — the same reason severance carries one.
          # Always exported, even when the secret does not exist: goreleaser
          # skips the cask on an empty value, so a release without it still
          # produces the archives and the GitHub release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Image digest
        id: digest
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "digest=$(docker buildx imagetools inspect "ghcr.io/gruesomeparty/marginalia:${TAG#v}" --format '{{.Manifest.Digest}}')" >>"$GITHUB_OUTPUT"
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gruesomeparty/marginalia
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
  # The image as published, scanned after the push and reported to code
  # scanning, so a vulnerability found later against a shipped tag shows up
  # under Security rather than only in a CI log.
  scan-image:
    needs: [release-please, goreleaser]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Image reference
        id: img
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "ref=ghcr.io/gruesomeparty/marginalia:${TAG#v}" >>"$GITHUB_OUTPUT"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-image
