name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  goreleaser:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The hosted image goes to GHCR under this repository.
      packages: write
      # Build provenance: a signed statement, kept by GitHub and pushed beside
      # the image, of which workflow run built each artifact.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
      # The image is built for linux/amd64 and linux/arm64; the arm64 half
      # runs under emulation on this runner, which is what QEMU is for.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # goreleaser's sboms step shells out to syft.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pushes the Homebrew cask to gruesomeparty/homebrew-tap.
          # GITHUB_TOKEN cannot push cross-repo, so this is a PAT with
          # contents:write on the tap — the same reason severance carries one.
          # Always exported, even when the secret does not exist: goreleaser
          # skips the cask on an empty value, so a release without it still
          # produces the archives and the GitHub release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Attest the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - name: Image digest
        id: digest
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: echo "digest=$(docker buildx imagetools inspect "ghcr.io/gruesomeparty/marginalia:${TAG#v}" --format '{{.Manifest.Digest}}')" >>"$GITHUB_OUTPUT"
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/gruesomeparty/marginalia
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
