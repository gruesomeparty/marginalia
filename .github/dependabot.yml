# Every ecosystem here merges itself on green CI
# (.github/workflows/deps-automerge.yml), majors included, so CI is the review
# an update gets. Grouping keeps that to a few PRs a week rather than one per
# module.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    labels:
      - dependencies
      - github-actions
  # Go modules, minor and patch as one weekly PR; a major is a new import path,
  # which Dependabot does not rewrite, so it never opens one.
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
    labels:
      - dependencies
  # The Cloudflare template's wrangler and container library, as one monthly
  # PR: Containers move fast, and a deploy with a stale wrangler is where that
  # would show. The template's Dockerfile is not listed: its tag is
  # release-please's to move.
  - package-ecosystem: npm
    directory: "/deploy/cloudflare"
    schedule:
      interval: monthly
    groups:
      cloudflare-template:
        patterns: ["*"]
    labels:
      - dependencies
