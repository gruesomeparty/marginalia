version: 2
project_name: marginalia
before:
  hooks:
    - go mod tidy
builds:
  - id: marginalia
    main: .
    binary: marginalia
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/gruesomeparty/marginalia/cmd.version={{.Version}}
      - -X github.com/gruesomeparty/marginalia/cmd.commit={{.Commit}}
      - -X github.com/gruesomeparty/marginalia/cmd.date={{.Date}}
archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: checksums.txt

# The hosted image: the linux binaries above on a distroless base, as a
# non-root user, pushed to GHCR on every release for linux/amd64 (what
# Cloudflare Containers run) and linux/arm64, and joined under the version
# tag and `latest` by the manifests below. The Dockerfile only COPYs the
# binary goreleaser already built — one build path.
dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    use: buildx
    dockerfile: Dockerfile
    image_templates:
      - ghcr.io/gruesomeparty/marginalia:{{ .Version }}-amd64
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.title=marginalia
      - --label=org.opencontainers.image.description=Hand an agent-authored document to a human for block-anchored review
      - --label=org.opencontainers.image.source=https://github.com/gruesomeparty/marginalia
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT
  - id: arm64
    goos: linux
    goarch: arm64
    use: buildx
    dockerfile: Dockerfile
    image_templates:
      - ghcr.io/gruesomeparty/marginalia:{{ .Version }}-arm64
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.title=marginalia
      - --label=org.opencontainers.image.description=Hand an agent-authored document to a human for block-anchored review
      - --label=org.opencontainers.image.source=https://github.com/gruesomeparty/marginalia
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.licenses=MIT
docker_manifests:
  - name_template: ghcr.io/gruesomeparty/marginalia:{{ .Version }}
    image_templates:
      - ghcr.io/gruesomeparty/marginalia:{{ .Version }}-amd64
      - ghcr.io/gruesomeparty/marginalia:{{ .Version }}-arm64
  - name_template: ghcr.io/gruesomeparty/marginalia:latest
    image_templates:
      - ghcr.io/gruesomeparty/marginalia:{{ .Version }}-amd64
      - ghcr.io/gruesomeparty/marginalia:{{ .Version }}-arm64

# Publishes a cask to gruesomeparty/homebrew-tap, beside severance.
#
# A cask rather than a formula, and not because Marginalia is an app: goreleaser
# deprecated `brews` in favour of `homebrew_casks`, which follows Homebrew's own
# line that a formula builds from source while a prebuilt binary belongs in a
# cask. `binaries:` is what makes it a CLI on PATH rather than an .app.
#
# goreleaser emits on_linux blocks too, but a cask is a macOS mechanism: Linux
# stays served by the tarball and `go install`, which is what the four builds
# above are for.
homebrew_casks:
  - name: marginalia
    binaries: [marginalia]
    homepage: https://github.com/gruesomeparty/marginalia
    description: Hand an agent-authored document to a human for block-anchored review
    repository:
      owner: gruesomeparty
      name: homebrew-tap
      branch: main
      # GITHUB_TOKEN cannot push cross-repo, so this needs a PAT with
      # contents:write on the tap — the same reason severance carries one.
      #
      # `{{ .Env.NAME }}` and nothing else: goreleaser validates this one field
      # against that exact shape, so `index .Env "NAME"` — which is what the
      # rest of this file uses to survive a missing key — is rejected outright.
      # It is safe here only because the workflow always exports the variable,
      # empty or not, which is what keeps the key present.
      token: '{{ .Env.HOMEBREW_TAP_TOKEN }}'
    directory: Casks
    commit_author:
      name: marginalia-release
      email: noreply@github.com
    commit_msg_template: "feat: marginalia {{ .Version }}"
    # Without the token the release still has to succeed: the tarballs and the
    # GitHub release are the product, and the cask is a convenience on top.
    # `index .Env` rather than `.Env.X` deliberately — the latter is a hard
    # template error when the key is absent, so a repo that never set the
    # secret would fail its release at the very last step. index yields "".
    skip_upload: '{{ if eq (index .Env "HOMEBREW_TAP_TOKEN") "" }}true{{ else }}false{{ end }}'
    # An ad-hoc-signed binary from a release archive is quarantined by
    # Gatekeeper, exactly as severance's cask warns. Clearing it on install is
    # what makes `brew install` actually leave a working binary behind.
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"], print_stderr: false).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/marginalia"]
          end
changelog:
  disable: true
release:
  draft: false
